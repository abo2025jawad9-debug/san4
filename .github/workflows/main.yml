name: Bot Automation # هذا مجرد عنوان للمهمة في قيتهاب

on:
  schedule:
    # يعمل عند الدقيقة 0 من كل 6 ساعات
    - cron: '0 */7 * * *'
  workflow_dispatch: # زر للتشغيل اليدوي

permissions:
  contents: write # صلاحية ضرورية لرفع ملف sh.json

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Trading Bot
        # تم تصحيح الأسماء لتتطابق تماماً مع ما هو موجود في إعدادات مستودعك
        env:
          BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY }}
          BYBIT_API_SECRET: ${{ secrets.BYBIT_API_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u bot.py
